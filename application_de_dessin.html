<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Studio de Dessin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            touch-action: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            height: 100vh;
        }
        canvas {
            touch-action: none;
            cursor: crosshair;
        }
        /* Custom scrollbar for sidebar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body class="h-full flex flex-col md:flex-row select-none">

    <main class="flex-1 relative bg-slate-950 flex items-center justify-center overflow-hidden">
        <div id="canvas-container" class="relative shadow-2xl bg-white rounded-xl overflow-hidden cursor-crosshair" style="width: 800px; height: 600px;">
            <canvas id="drawingCanvas" class="absolute inset-0 w-full h-full"></canvas>
        </div>
        
        <!-- Floating Tool Indicator / Quick Info -->
        <div class="absolute top-4 left-4 bg-slate-900/80 backdrop-blur-md border border-slate-700/50 px-4 py-2 rounded-xl text-xs flex items-center gap-3 text-slate-300 shadow-lg pointer-events-none">
            <span class="flex items-center gap-1.5"><i class="fa-solid fa-layer-group text-indigo-400"></i> Page active: <strong id="current-page-label" class="text-white">1</strong></span>
            <span class="text-slate-600">|</span>
            <span class="flex items-center gap-1.5"><i class="fa-solid fa-pen-nib text-indigo-400"></i> Pression: <strong id="pressure-label" class="text-white">0.0x</strong></span>
        </div>
    </main>

    <aside class="w-full md:w-80 bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 flex flex-col h-auto md:h-full z-20 shadow-2xl">
        
        <!-- Header -->
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
            <h1 class="font-bold text-lg flex items-center gap-2 text-indigo-400">
                <i class="fa-solid fa-palette"></i> Studio de Dessin
            </h1>
            <span class="text-xs bg-indigo-500/10 text-indigo-400 px-2.5 py-1 rounded-full border border-indigo-500/20 font-medium">Apple Pencil Ready</span>
        </div>

        <!-- Scrollable Controls Container -->
        <div class="flex-1 overflow-y-auto p-4 space-y-6">

            <!-- Presets Croquis / Propre -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Mode de Tracé Preset</label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="preset-sketch" onclick="applyPreset('sketch')" class="flex items-center justify-center gap-2 p-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 hover:text-white transition-all text-xs font-medium">
                        <i class="fa-solid fa-pencil text-amber-400"></i> Croquis (Bleu/Gris)
                    </button>
                    <button id="preset-clean" onclick="applyPreset('clean')" class="flex items-center justify-center gap-2 p-2.5 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 hover:bg-slate-700 hover:text-white transition-all text-xs font-medium">
                        <i class="fa-solid fa-pen-clip text-emerald-400"></i> Propre (Encre)
                    </button>
                </div>
            </div>

            <div class="space-y-3">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Outils</label>
                <div class="grid grid-cols-3 gap-2">
                    <button id="tool-pen" onclick="setTool('pen')" class="flex flex-col items-center justify-center p-3 rounded-xl bg-indigo-600 text-white transition-all shadow-md hover:bg-indigo-500 active:scale-95">
                        <i class="fa-solid fa-pen text-lg mb-1"></i>
                        <span class="text-xs font-medium">Pinceau</span>
                    </button>
                    <button id="tool-eraser" onclick="setTool('eraser')" class="flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800 text-slate-300 transition-all hover:bg-slate-700 hover:text-white active:scale-95">
                        <i class="fa-solid fa-eraser text-lg mb-1"></i>
                        <span class="text-xs font-medium">Gomme</span>
                    </button>
                    <button id="tool-fill" onclick="setTool('fill')" class="flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800 text-slate-300 transition-all hover:bg-slate-700 hover:text-white active:scale-95">
                        <i class="fa-solid fa-fill-drip text-lg mb-1"></i>
                        <span class="text-xs font-medium">Remplir</span>
                    </button>
                </div>
            </div>

            <div class="space-y-4 bg-slate-950/40 p-4 rounded-xl border border-slate-800/60">
                <div>
                    <div class="flex justify-between text-xs font-semibold text-slate-400 mb-2">
                        <span>Couleur</span>
                        <input type="color" id="colorPicker" value="#0f172a" class="w-6 h-6 rounded cursor-pointer bg-transparent border-0">
                    </div>
                    <!-- Quick colors -->
                    <div class="flex gap-2 justify-between">
                        <button onclick="setColor('#0f172a')" class="w-7 h-7 rounded-full bg-slate-900 border-2 border-slate-700 hover:scale-110 transition-transform"></button>
                        <button onclick="setColor('#3b82f6')" class="w-7 h-7 rounded-full bg-blue-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setColor('#ef4444')" class="w-7 h-7 rounded-full bg-red-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setColor('#10b981')" class="w-7 h-7 rounded-full bg-emerald-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setColor('#f59e0b')" class="w-7 h-7 rounded-full bg-amber-500 hover:scale-110 transition-transform"></button>
                        <button onclick="setColor('#8b5cf6')" class="w-7 h-7 rounded-full bg-purple-500 hover:scale-110 transition-transform"></button>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between text-xs font-medium">
                        <span class="text-slate-400">Taille de base</span>
                        <span id="size-display" class="text-indigo-400 font-bold">5 px</span>
                    </div>
                    <input type="range" id="brushSize" min="1" max="50" value="5" class="w-full accent-indigo-500 cursor-pointer">
                    <p class="text-[11px] text-slate-500 italic">Apple Pencil: plus vous appuyez fort, plus le trait s'élargit dynamiquement.</p>
                </div>

                <div class="space-y-2 pt-2 border-t border-slate-800/60">
                    <div class="flex justify-between text-xs font-medium">
                        <span class="text-slate-400">Tolérance de Remplissage</span>
                        <span id="tolerance-display" class="text-indigo-400 font-bold">32</span>
                    </div>
                    <input type="range" id="fillTolerance" min="1" max="100" value="32" class="w-full accent-indigo-500 cursor-pointer">
                </div>
            </div>

            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Pages & Pelure d'oignon</label>
                    <button onclick="addNewPage()" class="text-xs bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg font-medium flex items-center gap-1.5 transition-all shadow-md active:scale-95">
                        <i class="fa-solid fa-plus"></i> Nouvelle Page
                    </button>
                </div>

                <!-- Page List -->
                <div id="pages-list" class="space-y-2 max-h-64 overflow-y-auto pr-1">
                    <!-- Dynamically populated page cards -->
                </div>
            </div>

        </div>

        <!-- Footer Actions -->
        <div class="p-4 border-t border-slate-800 flex gap-2">
            <button onclick="clearCurrentPage()" class="flex-1 bg-slate-800 hover:bg-red-950/40 hover:text-red-400 text-slate-300 py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all">
                <i class="fa-solid fa-rotate-left"></i> Effacer
            </button>
            <button onclick="downloadCanvas()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all shadow-md">
                <i class="fa-solid fa-download"></i> Exporter
            </button>
        </div>
    </aside>

    <script>
        // Application State
        let pages = [];
        let currentPageIndex = 0;
        let currentTool = 'pen'; // 'pen', 'eraser', 'fill'
        let currentColor = '#0f172a';
        let baseBrushSize = 5;
        let fillTolerance = 32;
        let isDrawing = false;
        let lastX = 0;
        let lastY = 0;
        let currentPressure = 0.5;

        // Canvas & Container
        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const canvasContainer = document.getElementById('canvas-container');

        // Initialize Canvas resolution matching display size
        function initCanvasSize() {
            const rect = canvasContainer.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            
            ctx.scale(dpr, dpr);
            redrawAll();
        }

        // Page Class representation
        class Page {
            constructor(id) {
                this.id = id;
                this.name = `Page ${id}`;
                this.visible = true;
                this.canvas = document.createElement('canvas');
                this.ctx = this.canvas.getContext('2d', { willReadFrequently: true });
                this.resizeOffscreen();
            }

            resizeOffscreen() {
                const rect = canvasContainer.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                this.canvas.width = rect.width * dpr;
                this.canvas.height = rect.height * dpr;
                this.ctx.scale(dpr, dpr);
            }

            clear() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                redrawAll();
            }
        }

        function addNewPage() {
            const newId = pages.length + 1;
            const newPage = new Page(newId);
            pages.push(newPage);
            currentPageIndex = pages.length - 1;
            updatePagesUI();
            redrawAll();
        }

        function deletePage(index, event) {
            event.stopPropagation();
            if (pages.length <= 1) {
                // Clear page if it's the last remaining page
                pages[0].clear();
                return;
            }
            pages.splice(index, 1);
            if (currentPageIndex >= pages.length) {
                currentPageIndex = pages.length - 1;
            }
            updatePagesUI();
            redrawAll();
        }

        function switchPage(index) {
            currentPageIndex = index;
            updatePagesUI();
            redrawAll();
        }

        function togglePageVisibility(index, event) {
            event.stopPropagation();
            pages[index].visible = !pages[index].visible;
            updatePagesUI();
            redrawAll();
        }

        function clearCurrentPage() {
            if (pages.length === 0) return;
            pages[currentPageIndex].clear();
        }

        function applyPreset(mode) {
            setTool('pen');
            if (mode === 'sketch') {
                setColor('#64748b'); // Slate grey sketch color
                baseBrushSize = 3;
            } else if (mode === 'clean') {
                setColor('#000000'); // Clean dark ink color
                baseBrushSize = 6;
            }
            document.getElementById('brushSize').value = baseBrushSize;
            document.getElementById('size-display').textContent = baseBrushSize + ' px';
        }

        function updatePagesUI() {
            const listContainer = document.getElementById('pages-list');
            listContainer.innerHTML = '';
            
            document.getElementById('current-page-label').textContent = currentPageIndex + 1;

            pages.forEach((page, idx) => {
                const isActive = idx === currentPageIndex;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-xl border transition-all cursor-pointer ${
                    isActive 
                        ? 'bg-indigo-950/40 border-indigo-500/50 text-white shadow-md' 
                        : 'bg-slate-950/20 border-slate-800/80 text-slate-400 hover:bg-slate-800/40'
                }`;
                div.onclick = () => switchPage(idx);

                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="w-6 h-6 rounded-lg bg-slate-800 flex items-center justify-center text-xs font-bold ${isActive ? 'text-indigo-400 bg-indigo-900/50' : 'text-slate-400'}">${idx + 1}</span>
                        <span class="text-xs font-medium">${page.name}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="togglePageVisibility(${idx}, event)" title="${page.visible ? 'Masquer la pelure d\'oignon' : 'Afficher'}" class="w-7 h-7 rounded-lg flex items-center justify-center text-xs hover:bg-slate-800 transition-colors ${page.visible ? 'text-indigo-400' : 'text-slate-600'}">
                            <i class="fa-solid ${page.visible ? 'fa-eye' : 'fa-eye-slash'}"></i>
                        </button>
                        <button onclick="deletePage(${idx}, event)" title="Supprimer la page" class="w-7 h-7 rounded-lg flex items-center justify-center text-xs hover:bg-red-950/50 hover:text-red-400 text-slate-500 transition-colors">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                listContainer.appendChild(div);
            });
        }

        function redrawAll() {
            const rect = canvasContainer.getBoundingClientRect();
            ctx.clearRect(0, 0, rect.width, rect.height);
            
            // Draw background white base
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, rect.width, rect.height);

            // Onion skinning layer logic
            pages.forEach((page, idx) => {
                if (!page.visible) return;

                ctx.save();
                if (idx < currentPageIndex) {
                    ctx.globalAlpha = 0.3;
                    ctx.filter = 'grayscale(100%)';
                } else if (idx === currentPageIndex) {
                    ctx.globalAlpha = 1.0;
                    ctx.filter = 'none';
                } else {
                    ctx.globalAlpha = 0.15;
                    ctx.filter = 'grayscale(100%)';
                }

                ctx.drawImage(page.canvas, 0, 0, rect.width, rect.height);
                ctx.restore();
            });
        }

        function setTool(tool) {
            currentTool = tool;
            ['pen', 'eraser', 'fill'].forEach(t => {
                const btn = document.getElementById(`tool-${t}`);
                if (t === tool) {
                    btn.className = "flex flex-col items-center justify-center p-3 rounded-xl bg-indigo-600 text-white transition-all shadow-md active:scale-95";
                } else {
                    btn.className = "flex flex-col items-center justify-center p-3 rounded-xl bg-slate-800 text-slate-300 transition-all hover:bg-slate-700 hover:text-white active:scale-95";
                }
            });
        }

        function setColor(hex) {
            currentColor = hex;
            document.getElementById('colorPicker').value = hex;
        }

        document.getElementById('colorPicker').addEventListener('input', (e) => {
            currentColor = e.target.value;
        });

        const brushSizeSlider = document.getElementById('brushSize');
        brushSizeSlider.addEventListener('input', (e) => {
            baseBrushSize = parseInt(e.target.value);
            document.getElementById('size-display').textContent = baseBrushSize + ' px';
        });

        const fillToleranceSlider = document.getElementById('fillTolerance');
        fillToleranceSlider.addEventListener('input', (e) => {
            fillTolerance = parseInt(e.target.value);
            document.getElementById('tolerance-display').textContent = fillTolerance;
        });

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (pages.length === 0) return;
            const coords = getCanvasCoordinates(e);
            isDrawing = true;
            lastX = coords.x;
            lastY = coords.y;

            // Apple Pencil dynamic pressure readout (default to standard pressure if not supported)
            currentPressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
            document.getElementById('pressure-label').textContent = currentPressure.toFixed(2) + 'x';

            if (currentTool === 'fill') {
                performHighPrecisionFloodFill(Math.round(coords.x), Math.round(coords.y));
                isDrawing = false;
            } else {
                // Draw initial point dot
                drawStrokeSegment(lastX, lastY, coords.x, coords.y, currentPressure);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing || pages.length === 0) return;
            if (currentTool === 'fill') return;

            const coords = getCanvasCoordinates(e);
            currentPressure = (e.pressure && e.pressure > 0) ? e.pressure : 0.5;
            document.getElementById('pressure-label').textContent = currentPressure.toFixed(2) + 'x';

            drawStrokeSegment(lastX, lastY, coords.x, coords.y, currentPressure);

            lastX = coords.x;
            lastY = coords.y;

            redrawAll();
        });

        function drawStrokeSegment(x1, y1, x2, y2, pressure) {
            const activePage = pages[currentPageIndex];
            const pCtx = activePage.ctx;

            pCtx.save();
            pCtx.beginPath();
            pCtx.moveTo(x1, y1);
            pCtx.lineTo(x2, y2);

            // Dynamic line width directly linked to pressure (ranges from 0.2x to 3.0x of base size)
            const dynamicSize = baseBrushSize * (0.2 + (pressure * 2.8));

            if (currentTool === 'pen') {
                pCtx.strokeStyle = currentColor;
                pCtx.globalCompositeOperation = 'source-over';
            } else if (currentTool === 'eraser') {
                pCtx.strokeStyle = '#ffffff';
                pCtx.globalCompositeOperation = 'destination-out';
            }

            pCtx.lineWidth = dynamicSize;
            pCtx.lineCap = 'round';
            pCtx.lineJoin = 'round';
            pCtx.stroke();
            pCtx.restore();
        }

        canvas.addEventListener('pointerup', () => { isDrawing = false; });
        canvas.addEventListener('pointercancel', () => { isDrawing = false; });

        function performHighPrecisionFloodFill(startX, startY) {
            const activePage = pages[currentPageIndex];
            const dpr = window.devicePixelRatio || 1;

            const width = activePage.canvas.width;
            const height = activePage.canvas.height;

            const targetX = Math.floor(startX * dpr);
            const targetY = Math.floor(startY * dpr);

            if (targetX < 0 || targetX >= width || targetY < 0 || targetY >= height) return;

            // Retrieve current active layer context
            const pageCtx = activePage.ctx;
            const imgData = pageCtx.getImageData(0, 0, width, height);
            const data = imgData.data;

            const startIndex = (targetY * width + targetX) * 4;
            const startR = data[startIndex];
            const startG = data[startIndex + 1];
            const startB = data[startIndex + 2];
            const startA = data[startIndex + 3];

            // Parse destination color
            const hex = currentColor.replace('#', '');
            const fillR = parseInt(hex.substring(0, 2), 16);
            const fillG = parseInt(hex.substring(2, 4), 16);
            const fillB = parseInt(hex.substring(4, 6), 16);
            const fillA = 255;

            // Don't fill if color matches target exactly
            if (Math.abs(startR - fillR) < 5 && Math.abs(startG - fillG) < 5 && 
                Math.abs(startB - fillB) < 5 && Math.abs(startA - fillA) < 5) {
                return;
            }

            // Color matching with configurable tolerance
            function matchColor(index) {
                const r = data[index];
                const g = data[index + 1];
                const b = data[index + 2];
                const a = data[index + 3];

                const diff = Math.abs(r - startR) + Math.abs(g - startG) + Math.abs(b - startB) + Math.abs(a - startA);
                return diff <= fillTolerance * 3;
            }

            // Fast Queue Flood Fill (Span-based scanline for high precision & speed)
            const visited = new Uint8Array(width * height);
            const queue = [targetX, targetY];

            while (queue.length > 0) {
                const cy = queue.pop();
                const cx = queue.pop();

                const pixelIndex = (cy * width + cx) * 4;
                if (visited[cy * width + cx]) continue;

                data[pixelIndex] = fillR;
                data[pixelIndex + 1] = fillG;
                data[pixelIndex + 2] = fillB;
                data[pixelIndex + 3] = fillA;
                visited[cy * width + cx] = 1;

                // Push 4-directional neighbours
                const neighbors = [
                    [cx + 1, cy],
                    [cx - 1, cy],
                    [cx, cy + 1],
                    [cx, cy - 1]
                ];

                for (let i = 0; i < 4; i++) {
                    const nx = neighbors[i][0];
                    const ny = neighbors[i][1];

                    if (nx >= 0 && nx < width && ny >= 0 && ny < height) {
                        const nIdx = ny * width + nx;
                        if (!visited[nIdx] && matchColor(nIdx * 4)) {
                            queue.push(nx, ny);
                        }
                    }
                }
            }

            pageCtx.putImageData(imgData, 0, 0);
            redrawAll();
        }

        function downloadCanvas() {
            const link = document.createElement('a');
            link.download = `dessin-page-${currentPageIndex + 1}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Window resize handler
        window.addEventListener('resize', () => {
            initCanvasSize();
            pages.forEach(p => p.resizeOffscreen());
            redrawAll();
        });

        // Initialize default page on load
        window.onload = () => {
            initCanvasSize();
            addNewPage();
        };
    </script>
</body>
</html>
